<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veterinary Clinic Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* ── BASE STYLES ── */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    * {
      box-sizing: border-box;
    }

    /* ── PERFECTLY CENTERED LOGIN SCREEN ── */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      background: #2c3e50;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 380px;
      text-align: left;
    }

    /* ── LOGO STYLING ── */
    .login-logo {
      display: block;
      max-width: 130px;
      max-height: 130px;
      margin: 0 auto 18px auto;
      object-fit: contain;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #2c3e50;
      font-size: 24px;
      text-align: center;
    }

    .login-card p {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #34495e;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #27ae60;
      box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15);
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .login-card button:hover {
      background: #219150;
    }

    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 15px;
      text-align: center;
      font-weight: 500;
    }

    /* ── APP HEADER & LAYOUT ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #2c3e50;
      color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #c0392b;
    }

    main {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .controls-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .controls-card select {
      padding: 9px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    /* ── TABLES & BUTTONS ── */
    .table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .table th, .table td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #edf2f7;
    }

    .table th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
    }

    button.small {
      padding: 7px 14px;
      font-size: 13px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.green {
      background: #27ae60;
    }

    button.green:hover {
      background: #219150;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN WITH LOGO -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <img src="https://imagizer.imageshack.com/img922/6610/49hxJr.png" alt="Clinic Logo" class="login-logo" onerror="this.style.display='none';" />
      
      <h2>🐾 Clinic Login</h2>
      <p>Enter your credentials to access the clinic app.</p>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@clinic.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>

      <button id="loginBtn" onclick="handleLogin()">Log In</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- 2. MAIN APP SCREEN -->
  <div id="appScreen" style="display: none;">
    <header>
      <h2>🏥 Veterinary Clinic Management</h2>
      <button class="logout-btn" onclick="handleLogout()">🚪 Log Out</button>
    </header>

    <main>
      <div class="controls-card">
        <label for="vaccineType"><b>Select Vaccine Type:</b></label>
        <select id="vaccineType" onchange="loadVaccines()">
          <option value="DHPPI">DHPPI / DHPPi</option>
          <option value="Rabies">Rabies</option>
          <option value="Leptospirosis">Leptospirosis</option>
          <option value="Bordetella">Bordetella</option>
          <option value="Feligen">Feligen</option>
          <option value="Tricat">Tricat</option>
        </select>
        <button class="small green" onclick="loadVaccines()">🔄 Refresh</button>
      </div>

      <div id="vaccinesList"><i>Select a vaccine to load records...</i></div>
    </main>
  </div>

  <script>
    // ── CONFIGURATION (UPDATE WITH YOUR SUPABASE DETAILS) ──
    const SUPABASE_URL = "https://rblsaavfuwhbgexfgbvt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_71ARKZBjLO4_sbwfZCzh9Q_bi3bJ7ES";
  
    

    const supabaseAuth = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let petsData = [];
    let ownersData = [];

    // ── DYNAMIC EDGE FUNCTION API ROUTER ──
    // Works for: 'clinic-api', 'drive-upload', 'calendar-proxy'
    async function api(functionName, action, payload = {}) {
      const { data: { session } } = await supabaseAuth.auth.getSession();
      const token = session ? session.access_token : SUPABASE_ANON_KEY;

      const endpointUrl = `${SUPABASE_URL}/functions/v1/${functionName}`;

      const res = await fetch(endpointUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ action, payload })
      });

      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `Error from ${functionName}`);
      return data;
    }

    // ── CONVENIENCE WRAPPERS FOR YOUR 3 EDGE FUNCTIONS ──
    const clinicApi = (action, payload) => api('clinic-api', action, payload);
    const driveApi = (action, payload) => api('drive-upload', action, payload);
    const calendarApi = (action, payload) => api('calendar-proxy', action, payload);

    // ── AUTHENTICATION MANAGEMENT ──
    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await supabaseAuth.auth.getSession();
      if (session) {
        showApp();
      } else {
        showLogin();
      }
    });

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        errorDiv.innerText = "Please enter both email and password.";
        return;
      }

      errorDiv.innerText = "";
      loginBtn.disabled = true;
      loginBtn.innerText = "Logging in...";

      try {
        const { error } = await supabaseAuth.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showApp();
      } catch (err) {
        errorDiv.innerText = err.message || "Invalid credentials.";
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Log In";
      }
    }

    async function handleLogout() {
      if (!confirm("Log out of system?")) return;
      await supabaseAuth.auth.signOut();
      showLogin();
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      initialDataLoad();
    }

    function showLogin() {
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    async function initialDataLoad() {
      try {
        petsData = await clinicApi('getPets') || [];
        ownersData = await clinicApi('getOwners') || [];
        loadVaccines();
      } catch(e) {
        console.error('Failed to pre-load pets/owners:', e);
      }
    }

    // ── VACCINE LOGIC (USING CLINIC-API) ──
    async function loadVaccines() {
      const keyword = document.getElementById('vaccineType').value;
      document.getElementById('vaccinesList').innerHTML = '<i>Loading vaccine records...</i>';
      
      try {
        const { medData, remData } = await clinicApi('getVaccines', { keyword });
        if (!medData || !medData.length) { 
          document.getElementById('vaccinesList').innerHTML = '<i>No vaccine records found for ' + keyword + '.</i>'; 
          return; 
        }

        const latestVaccine = {};
        medData.forEach(r => { 
          if (r.pet_id && r.date && (!latestVaccine[r.pet_id] || r.date > latestVaccine[r.pet_id])) {
            latestVaccine[r.pet_id] = r.date;
          }
        });

        const reminders = {};
        (remData || []).forEach(r => { 
          reminders[`${r.pet_id}|${r.last_date}`] = r.reminded; 
        });

        const result = [];
        Object.keys(latestVaccine).forEach(petID => {
          const pet = petsData.find(p => p.id === petID); 
          if (!pet) return;

          const owner = ownersData.find(o => o.id === pet.owner_id);
          const lastDate = latestVaccine[petID];
          
          const [y, m, d] = lastDate.split('-');
          const nextDate = `${parseInt(y) + 1}-${m}-${d}`;

          result.push({ 
            petID, 
            petName: pet.name, 
            ownerName: owner ? owner.name : '', 
            lastDate, 
            nextDate, 
            reminded: reminders[`${petID}|${lastDate}`] || false 
          });
        });

        result.sort((a, b) => a.nextDate.localeCompare(b.nextDate));
        renderVaccines(result);
      } catch(e) { 
        document.getElementById('vaccinesList').innerHTML = '<i>Error loading vaccine records.</i>'; 
        console.error(e); 
      }
    }

    function renderVaccines(data) {
      const todayStr = new Date().toLocaleDateString('sv-SE');
      
      const overdue = data.filter(v => v.nextDate < todayStr);
      const upcoming = data.filter(v => v.nextDate >= todayStr);

      let html = '';
      if (overdue.length) html += `<h3 style="color:#c0392b;margin-bottom:12px;">⚠️ Overdue (${overdue.length})</h3>` + buildVaccineTable(overdue, true);
      if (upcoming.length) html += `<h3 style="color:#27ae60;margin-top:28px;margin-bottom:12px;">✅ Upcoming (${upcoming.length})</h3>` + buildVaccineTable(upcoming, false);
      if (!html) html = '<i>No records found.</i>';
      
      document.getElementById('vaccinesList').innerHTML = html;
    }

    function buildVaccineTable(list, isOverdue) {
      const today = new Date(); 
      today.setHours(0, 0, 0, 0);

      let html = `<table class="table"><thead><tr><th>Pet</th><th>Owner</th><th>Last Vaccine</th><th>Next Due</th><th>Status / Days</th><th>Reminded</th><th>Action</th></tr></thead><tbody>`;
      
      list.forEach(v => {
        const [y, m, d] = v.nextDate.split('-').map(Number);
        const targetDate = new Date(y, m - 1, d);
        const diff = Math.round((targetDate - today) / 86400000);

        const diffText = isOverdue 
          ? `<span style="color:#c0392b;font-weight:bold">${Math.abs(diff)} days overdue</span>` 
          : `<span style="color:#27ae60">${diff} days away</span>`;
          
        const rowColor = v.reminded ? 'background:#e8f5e9' : isOverdue ? 'background:#fff5f5' : '';

        let actionButton = '';
        if (v.reminded) {
          actionButton = `<button class="small" disabled style="background:#888;cursor:not-allowed;">✅ Sent</button>`;
        } else if (diff <= 30) {
          actionButton = `<button class="small green" onclick="sendVaccineReminder('${v.petID}','${v.petName}','${v.ownerName}','${v.nextDate}','${v.lastDate}',this)">📧 Send</button>`;
        }

        html += `<tr style="${rowColor}" id="row-${v.petID}">
          <td><b>${v.petName}</b></td>
          <td>${v.ownerName}</td>
          <td>${v.lastDate}</td>
          <td><b>${v.nextDate}</b></td>
          <td>${diffText}</td>
          <td style="text-align:center">
            <input type="checkbox" ${v.reminded ? 'checked' : ''} onchange="toggleReminder('${v.petID}','${v.lastDate}',this.checked,this)">
          </td>
          <td>${actionButton}</td>
        </tr>`;
      });

      return html + '</tbody></table>';
    }

    async function toggleReminder(petID, lastDate, reminded, checkbox) {
      const keyword = document.getElementById('vaccineType').value;
      const row = document.getElementById('row-' + petID);
      
      if (row) {
        row.style.background = reminded ? '#e8f5e9' : '';
        
        const btn = row.querySelector('button');
        if (btn) {
          if (reminded) {
            btn.disabled = true;
            btn.innerText = '✅ Sent';
            btn.className = 'small';
            btn.style.background = '#888';
            btn.style.cursor = 'not-allowed';
          } else {
            btn.disabled = false;
            btn.innerText = '📧 Send';
            btn.className = 'small green';
            btn.style.background = '';
            btn.style.cursor = 'pointer';
          }
        }
      }
      
      try { 
        await clinicApi('toggleReminder', { pet_id: petID, keyword, last_date: lastDate, reminded }); 
      } catch(e) { 
        console.error(e); 
        if (checkbox) checkbox.checked = !reminded;
      }
    }

    async function sendVaccineReminder(petID, petName, ownerName, nextDate, lastDate, btn) {
      if (!confirm(`Send reminder email to ${ownerName} for ${petName}?`)) return;
      
      btn.disabled = true; 
      btn.innerText = 'Sending...';

      const pet = petsData.find(p => p.id === petID);
      const owner = pet ? ownersData.find(o => o.id === pet.owner_id) : null;

      if (!owner || !owner.email) { 
        alert('No email address found for this owner.'); 
        btn.disabled = false; 
        btn.innerText = '📧 Send'; 
        return; 
      }

      const keyword = document.getElementById('vaccineType').value;
      const row = document.getElementById('row-' + petID);

      try {
        await clinicApi('sendVaccineReminder', {
          ownerEmail: owner.email,
          ownerName,
          petName,
          nextDate,
          keyword,
          pet_id: petID,
          last_date: lastDate
        });

        btn.innerText = '✅ Sent'; 
        btn.className = 'small';
        btn.style.background = '#888';
        btn.style.cursor = 'not-allowed';

        if (row) {
          const cb = row.querySelector('input[type=checkbox]');
          if (cb) cb.checked = true;
          row.style.background = '#e8f5e9'; 
        }
      } catch(e) {
        alert('Failed to send email: ' + e.message);
        btn.disabled = false; 
        btn.innerText = '📧 Send';
      }
    }

    // ── EXAMPLE USAGE FOR YOUR OTHER 2 EDGE FUNCTIONS ──
    // You can call driveApi() and calendarApi() anywhere in your codebase like this:
    /*
      async function uploadFileToDrive(fileData) {
        const result = await driveApi('uploadFile', { file: fileData });
        console.log('Uploaded to Drive:', result);
      }

      async function syncAppointments(events) {
        const result = await calendarApi('syncCalendar', { events });
        console.log('Calendar synced:', result);
      }
    */
  </script>
</body>
</html>
